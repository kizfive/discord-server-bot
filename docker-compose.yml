services:
  discord-bot:
    build: .
    container_name: discord-link-bot
    restart: unless-stopped
    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN}
      DISCORD_CHANNEL_ID: ${DISCORD_CHANNEL_ID:-}
      DISCORD_LOG_USER_ID: ${DISCORD_LOG_USER_ID:-}
      DISCORD_REPORT_CHANNEL_ID: ${DISCORD_REPORT_CHANNEL_ID:-}
      DISCORD_REPORT_USER_ID: ${DISCORD_REPORT_USER_ID:-}
      DISCORD_REPORT_TIME: ${DISCORD_REPORT_TIME:-09:00}
      DISCORD_PROXY: ${DISCORD_PROXY:-}
      DISCORD_FORCE_IPV4: ${DISCORD_FORCE_IPV4:-}
      DISCORD_TRUST_ENV_PROXY: ${DISCORD_TRUST_ENV_PROXY:-}
    volumes:
      - ./logs:/app/logs
